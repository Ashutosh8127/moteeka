<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Moteeka</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta name="theme-color" content="#221f1b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@400;500;700&family=Marcellus&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/config.js"></script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="logo" aria-hidden="true"></span>
      <span class="mark">Moteeka</span><span class="sub">Silver &amp; Gold-Plated</span></a>
    <nav class="cats"><a href="/">All pieces</a></nav>
    <button class="cart-btn" id="cart-open">Cart <span class="count" id="cart-count">0</span></button>
  </div>
</header>
<main class="wrap">
  <div class="detail" id="detail">
    <div class="gallery">
      <div class="main skeleton" style="aspect-ratio:1"></div>
    </div>
    <div>
      <div class="skeleton" style="height:32px;width:70%"></div>
      <div class="skeleton" style="height:16px;width:50%;margin-top:14px"></div>
    </div>
  </div>
  <section class="reviews" id="reviews"></section>
  <section class="related" id="related" hidden></section>
</main>

<!--
  On a phone the buy row sits above a long page of photographs, care notes and
  specifications, and scrolling back up to it is the step people abandon.
  Appears once the real buy row has scrolled away, and never on desktop, where
  the buy column is sticky already.
-->
<div class="buy-bar" id="buy-bar" hidden>
  <div class="bb-price"><span id="bb-now"></span><s id="bb-was"></s></div>
  <button class="btn" id="bb-add">Add to cart</button>
</div>

<footer class="site"><div class="wrap" id="footer"></div></footer>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="cart" data-open="false" aria-label="Shopping cart">
  <header>
    <h2>Your cart</h2>
    <button class="btn ghost" id="cart-close" style="padding:6px 13px;font-size:13px">Close</button>
  </header>
  <div class="lines" id="cart-lines"></div>
  <div class="totals" id="cart-totals"></div>
  <div class="actions"><button class="btn" id="checkout" style="width:100%" disabled>Checkout</button></div>
</aside>
<script type="module" src="/assets/js/product.js"></script>
<script type="module" src="/assets/js/footer.js"></script>
</body>
</html>
