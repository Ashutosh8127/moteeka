<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- A tab has no page behind it, so the mark brings its own ground. At 16px
       the thread and the shading are gone and three graduated dots are all that
       is left — which is still enough to pick out of a row of tabs. -->
  <rect width="48" height="48" rx="10" fill="#221f1b"/>
  <path d="M11 32 Q26 28.5 39 20" fill="none" stroke="#f2eee7" stroke-width="1.4" stroke-linecap="round" opacity=".4"/>
  <circle cx="12" cy="32" r="3.4" fill="#f2eee7"/>
  <circle cx="23" cy="29" r="5" fill="#f2eee7"/>
  <circle cx="36.5" cy="21" r="7.2" fill="#f2eee7"/>
</svg>
