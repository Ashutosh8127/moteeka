<!doctype html>

<head>

<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="/">
      <img class="logo" src="/brand/mark.svg" alt="" width="30" height="30">
      <span class="mark">Moteeka</span><span class="sub">Silver &amp; Gold-Plated</span></a>
    <nav class="cats"><a href="/">All pieces</a></nav>
  </div>
</header>

<main class="wrap">
  <!--
    A piece that has been renamed or taken down lands here. Search is offered
    rather than a bare apology: whoever followed the link wanted something
    specific, and the catalogue probably still has it under another name.
  -->
  <section class="gone">
    <h1>That page has moved or gone</h1>
    <p>A piece may have been renamed, or sold out and been taken down. The rest of
    the catalogue is still here.</p>
    <form class="find" action="/" method="get">
      <input type="search" name="search" placeholder="Search jhumka, anklet, necklace…" aria-label="Search the catalogue">
      <button class="btn" type="submit">Search</button>
    </form>
    <p class="muted-note">Looking for an order? <a href="/order.html">Track it with your reference</a>.
    Something else — <a href="/contact.html">get in touch</a>.</p>
  </section>
  <section class="related" id="related" hidden></section>
</main>

<footer class="site"><div class="wrap" id="footer"></div></footer>
<script type="module" src="/assets/js/notfound.js"></script>
<script type="module" src="/assets/js/footer.js"></script>
</body>
</html>
